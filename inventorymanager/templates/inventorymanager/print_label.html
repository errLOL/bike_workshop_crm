<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Этикетка #{{ order.id }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Стили для экрана (кнопка + этикетка) */
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Контейнер для кнопки и этикетки */
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        /* Кнопка печати */
        .print-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
            transition: background 0.2s;
            order: 1; /* Кнопка сверху */
        }

        .print-btn:hover {
            background: #45a049;
        }

        .print-btn:active {
            transform: scale(0.97);
        }

        /* Ссылка назад */
        .back-link {
            color: #888;
            font-size: 13px;
            text-decoration: none;
            order: 2; /* Ссылка под кнопкой */
        }

        .back-link:hover {
            color: #555;
        }

        /* Этикетка (видна на экране как карточка) */
        .label {
            width: 58mm;
            height: 30mm;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            padding: 1mm;
            display: flex;
            align-items: center;
            justify-content: center;
            order: 3; /* Этикетка после кнопок */
            flex-shrink: 0;
        }

        .label .qr-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .label .qr-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Логотип поверх QR */
        .label .logo-overlay {
            position: absolute;
            width: 20%;
            height: 20%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .label .logo-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ======================================== */
        /* СТИЛИ ДЛЯ ПЕЧАТИ — всё лишнее скрыто */
        /* ======================================== */
        @media print {
            /* Скрываем всё, что не этикетка */
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: auto !important;
                display: block !important;
            }

            .page-container {
                display: block !important;
                max-width: none !important;
                gap: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-btn,
            .back-link {
                display: none !important;
            }

            /* Сама этикетка при печати */
            .label {
                width: 58mm !important;
                height: 30mm !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                background: white !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }

            .label .qr-wrapper {
                width: 100% !important;
                height: 100% !important;
            }

            .label .qr-wrapper img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
            }
        }

        /* Настройки страницы для печати */
        @page {
            size: 58mm 30mm;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <button onclick="window.print()" class="print-btn">
            🖨️ Печать этикетки
        </button>

        <a href="{% url 'order_detail' order.id %}" class="back-link">
            ← Вернуться к заказу #{{ order.id }}
        </a>

        <div class="label">
            <div class="qr-wrapper">
                <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR-код заказа #{{ order.id }}">
            </div>
        </div>
    </div>

    <script>
        // Опционально: автопечать при загрузке (раскомментируйте, если нужно)
        // window.onload = function() { setTimeout(window.print, 500); };
    </script>
</body>
</html>
