<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Этикетка #{{ order.id }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .print-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
            transition: background 0.2s;
            order: 1;
        }

        .print-btn:hover {
            background: #45a049;
        }

        .print-btn:active {
            transform: scale(0.97);
        }

        .back-link {
            color: #888;
            font-size: 13px;
            text-decoration: none;
            order: 2;
        }

        .back-link:hover {
            color: #555;
        }

        /* ======================================== */
        /* ЭТИКЕТКА
        /* ======================================== */
        .label {
            width: 58mm;
            height: 30mm;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: row;
            align-items: center;
            order: 3;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* Левая часть — вертикальный текст */
        .label-left {
            flex: 0 0 40%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #e0e0e0;
            padding-left: 2mm;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 12px;
            line-height: 1.3;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            color: #333;
        }

        .vertical-text .info-line {
            display: block;
            padding: 1mm 0;
        }

        .vertical-text .info-line .label-text {
            color: #999;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .vertical-text .info-line .value-text {
            color: #1a1a1a;
            font-weight: bold;
            font-size: 10px;
        }

        .vertical-text .info-line .value-text.phone {
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        /* Разделитель между строками */
        .vertical-text .divider {
            display: block;
            width: 1px;
            height: 2mm;
            background: #ddd;
            margin: 0.5mm auto;
        }

        /* Правая часть — QR код */
        .label-right {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .label-right .qr-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .label-right .qr-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ======================================== */
        /* СТИЛИ ДЛЯ ПЕЧАТИ */
        /* ======================================== */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: auto !important;
                display: block !important;
            }

            .page-container {
                display: block !important;
                max-width: none !important;
                gap: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-btn,
            .back-link {
                display: none !important;
            }

            .label {
                width: 58mm !important;
                height: 30mm !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 1.5mm !important;
                margin: 0 !important;
                display: flex !important;
                flex-direction: row !important;
                align-items: center !important;
                background: white !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }

            .label-left {
                flex: 0 0 40% !important;
                border-right: 1px solid #e0e0e0 !important;
            }

            .label-right {
                flex: 1 !important;
            }

            .label-right .qr-wrapper {
                width: 100% !important;
                height: 100% !important;
            }

            .label-right .qr-wrapper img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
            }
        }

        @page {
            size: 58mm 30mm;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <button onclick="window.print()" class="print-btn">
            🖨️ Печать этикетки
        </button>

        <a href="{% url 'order_detail' order.id %}" class="back-link">
            ← Вернуться к заказу #{{ order.id }}
        </a>

        <!-- Этикетка -->
        <div class="label">
            <!-- Левая колонка с вертикальным текстом -->
            <div class="label-left">
                <div class="vertical-text">
                    <span class="info-line">
                        <span class="label-text">Заказ</span><br>
                        <span class="value-text">#{{ order.id }}</span>
                    </span>
                    <span class="divider"></span>
                    <span class="info-line">
                        <span class="label-text">Клиент</span><br>
                        <span class="value-text">{{ order.customer.name }}</span>
                    </span>
                    <span class="divider"></span>
                    <span class="info-line">
                        <span class="label-text">Телефон</span><br>
                        <span class="value-text phone">{{ order.customer.phone }}</span>
                    </span>
                </div>
            </div>

            <!-- Правая колонка с QR кодом -->
            <div class="label-right">
                <div class="qr-wrapper">
                    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR-код заказа #{{ order.id }}">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Автопечать при загрузке (опционально)
        // window.onload = function() { setTimeout(window.print, 500); };
    </script>
</body>
</html>
